name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  native-modem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-numpy
      - name: Build native modem
        run: make -C vendor/linmodem CFLAGS='-O2 -Wall -g -D_GNU_SOURCE -fcommon'
      - name: Test synthetic waveforms and committed training fixtures
        shell: bash
        run: |
          for test in v8-cj v8-role-menu v90-cp v90-dil v90-s-detect v90-startup v90-reneg-training v90-trellis v90-frame-delivery v90-rtcp v90-b1 v90-train-tx v90-pcm v90-e-recovery v90-cps v90-cps-wave v90-echo linmodem-framing; do
            /usr/bin/python3 "tools/tests/$test.py"
          done
      - name: Test experimental soft receiver lifecycle
        run: |
          SIPFAX_V90_SOFT_RX=1 /usr/bin/python3 tools/tests/v90-e-recovery.py
          SIPFAX_V90_SOFT_RX=1 /usr/bin/python3 tools/tests/v90-cps-wave.py
