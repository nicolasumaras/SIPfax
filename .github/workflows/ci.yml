name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test RTP capture audit
        run: python3 -m unittest discover -s tools/tests -p test_audit_rtp.py
      - name: Test redundant audio packet bridge
        run: python3 -m unittest discover -s tools/tests -p test_sipfax_red.py
      - name: Test ATA call preparation
        run: python3 -m unittest discover -s tools/tests -p test_ata187_prepare.py

  native-modem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-numpy
      - name: Build native modem
        run: make -C vendor/linmodem CFLAGS='-O2 -Wall -g -D_GNU_SOURCE -fcommon'
      - name: Test synthetic waveforms and committed training fixtures
        shell: bash
        run: |
          set -e
          for test in v8-cj v8-role-menu v90-cp v90-dil v90-s-detect v90-startup v90-reneg-training v90-shell v90-carrier-fit v90-equalizer v90-equalizer-half v90-qam32 v90-qam8 v90-qam8-wave v90-trellis v90-frame-delivery v90-rtcp v90-b1 v90-train-tx v90-pcm v90-e-recovery v90-cps v90-cps-wave v90-echo v90-line-echo v90-echo-delay linmodem-framing; do
            /usr/bin/python3 "tools/tests/$test.py"
          done
      - name: Test upstream clock recovery
        run: |
          /usr/bin/python3 tools/tests/v90_shell_reference.py
          /usr/bin/python3 tools/tests/v90-qam8-wave.py --clock-drift
          /usr/bin/python3 tools/tests/v90-qam8-wave.py --9600
          /usr/bin/python3 tools/tests/v90-qam8-wave.py --9600 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --12000
          python3 tools/tests/v90-qam8-wave.py --12000 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --12000 --isi
          python3 tools/tests/v90-qam8-wave.py --14400
          python3 tools/tests/v90-qam8-wave.py --14400 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --14400 --isi
          python3 tools/tests/v90-qam32.py --16800
          python3 tools/tests/v90-qam32.py --19200
          python3 tools/tests/v90-qam32.py --21600
          python3 tools/tests/v90-qam32.py --24000
          python3 tools/tests/v90-qam32.py --26400
          python3 tools/tests/v90-qam32.py --28800
          python3 tools/tests/v90-equalizer.py --long
          python3 tools/tests/v90-qam8-wave.py --16800
          python3 tools/tests/v90-qam8-wave.py --16800 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --16800 --isi
          python3 tools/tests/v90-qam8-wave.py --19200
          python3 tools/tests/v90-qam8-wave.py --19200 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --19200 --isi
          python3 tools/tests/v90-qam8-wave.py --21600
          python3 tools/tests/v90-qam8-wave.py --21600 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --21600 --isi
          python3 tools/tests/v90-qam8-wave.py --21600 --clock-drift --isi
          python3 tools/tests/v90-qam8-wave.py --21600 --long-clock --isi
          python3 tools/tests/v90-qam8-wave.py --21600 --long-clock --isi --pcmu
          python3 tools/tests/v90-qam8-wave.py --19200 --long-clock --isi --pcmu
          python3 tools/tests/v90-qam8-wave.py --24000 --long-clock --isi --pcmu
          python3 tools/tests/v90-qam8-wave.py --24000 --long-clock --isi --pcmu --random-payloads --timing-sweep
      - name: Test experimental 26400 upstream waveform
        run: |
          python3 tools/tests/v90-qam8-wave.py --26400 --long-clock --isi --pcmu --random-payloads --timing-sweep
          for seed in 43127 62091 98017; do
            python3 tools/tests/v90-qam8-wave.py --26400 --long-clock --isi --pcmu --random-payloads --timing-sweep --seed "$seed" --keep-going
          done
      - name: Test experimental 28800 upstream waveform
        run: |
          python3 tools/tests/v90-qam8-wave.py --28800 --long-clock --isi --pcmu --random-payloads --timing-sweep
          for seed in 43127 62091 98017; do
            python3 tools/tests/v90-qam8-wave.py --28800 --long-clock --isi --pcmu --random-payloads --timing-sweep --seed "$seed" --keep-going
          done
      - name: Test automatic echo bridge framing
        run: SIPFAX_V90_LINE_ECHO=auto python3 tools/tests/linmodem-framing.py
      - name: Sanitize echo delay acquisition
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-echo-delay-sanitize.c vendor/linmodem/v90echodelay.c vendor/linmodem/v90lineecho.c -lm -o /tmp/v90-echo-delay-sanitize
          /tmp/v90-echo-delay-sanitize
      - name: Sanitize line echo history
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-line-echo-sanitize.c vendor/linmodem/v90lineecho.c -lm -o /tmp/v90-line-echo-sanitize
          /tmp/v90-line-echo-sanitize
      - name: Sanitize upstream shell mapping
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-shell-sanitize.c vendor/linmodem/v90shell.c -o /tmp/v90-shell-sanitize
          /tmp/v90-shell-sanitize
      - name: Sanitize provisional feedback history
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-feedback-sanitize.c vendor/linmodem/v90trellis.c vendor/linmodem/v90equalizer.c vendor/linmodem/v90shell.c -lm -o /tmp/v90-feedback-sanitize
          /tmp/v90-feedback-sanitize
      - name: Test experimental soft receiver lifecycle
        run: |
          SIPFAX_V90_SOFT_RX=1 /usr/bin/python3 tools/tests/v90-e-recovery.py
          SIPFAX_V90_SOFT_RX=1 /usr/bin/python3 tools/tests/v90-cps-wave.py
