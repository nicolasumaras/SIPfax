name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test RTP capture audit
        run: python3 -m unittest discover -s tools/tests -p test_audit_rtp.py
      - name: Test redundant audio packet bridge
        run: python3 -m unittest discover -s tools/tests -p test_sipfax_red.py
      - name: Test ATA call preparation
        run: python3 -m unittest discover -s tools/tests -p test_ata187_prepare.py

  native-modem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-numpy
      - name: Build native modem
        run: make -C vendor/linmodem CFLAGS='-O2 -Wall -g -D_GNU_SOURCE -fcommon'
      - name: Test synthetic waveforms and committed training fixtures
        shell: bash
        run: |
          set -e
          for test in v42-detect v42-startup v8-cj v8-role-menu v90-cp v90-dil v90-training-profile v90-s-detect v90-s-profile v90-startup v90-startup-profile v90-rate-selection v90-reneg-training v90-shell v90-mapping v90-carrier-fit v90-equalizer v90-equalizer-half v90-qam32 v90-qam8 v90-qam8-wave v90-trellis v90-frame-delivery v90-rtcp v90-b1 v90-train-tx v90-pcm v90-e-recovery v90-cps v90-cps-wave v90-echo v90-line-echo v90-echo-delay linmodem-framing; do
            /usr/bin/python3 "tools/tests/$test.py"
          done
      - name: Test 3200-symbol low carrier
        run: |
          set -e
          for rate in 4800 7200 9600 12000 14400 16800 19200 21600 24000 26400 28800 31200; do
            python3 tools/tests/v90-qam8-wave.py --low-carrier --"$rate" --pcmu
          done
          for rate in 26400 28800 31200; do
            python3 tools/tests/v90-qam8-wave.py --low-carrier --"$rate" --pcmu --long-clock --isi --random-payloads --timing-sweep --seed 98017
          done
      - name: Sanitize startup profile negotiation
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-startup-profile-sanitize.c vendor/linmodem/v90phase4.c vendor/linmodem/v90training.c vendor/linmodem/v90pcm.c vendor/linmodem/v90cp.c vendor/linmodem/v90dil.c vendor/linmodem/v90upstream.c vendor/linmodem/v90trellis.c vendor/linmodem/v90qam8.c vendor/linmodem/v90equalizer.c vendor/linmodem/v90shell.c vendor/linmodem/v90mapping.c vendor/linmodem/v90train_tx.c vendor/linmodem/v42detect.c vendor/linmodem/v90odp.c -lm -o /tmp/v90-startup-profile-sanitize
          /tmp/v90-startup-profile-sanitize
      - name: Sanitize startup PPP downshift
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-startup-downshift.c vendor/linmodem/v90phase4.c vendor/linmodem/v90training.c vendor/linmodem/v90pcm.c vendor/linmodem/v90cp.c vendor/linmodem/v90dil.c vendor/linmodem/v90upstream.c vendor/linmodem/v90trellis.c vendor/linmodem/v90qam8.c vendor/linmodem/v90equalizer.c vendor/linmodem/v90shell.c vendor/linmodem/v90mapping.c vendor/linmodem/v90train_tx.c vendor/linmodem/v42detect.c vendor/linmodem/v90odp.c -lm -o /tmp/v90-startup-downshift
          /tmp/v90-startup-downshift
      - name: Test 3000-symbol rate renegotiation
        run: |
          python3 tools/tests/v90-reneg-training.py --3000
          python3 tools/tests/v90-reneg-training.py --3000 --low-carrier
      - name: Sanitize Phase4 profile retention
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-phase4-profile-sanitize.c vendor/linmodem/v90phase4.c vendor/linmodem/v90training.c vendor/linmodem/v90pcm.c vendor/linmodem/v90cp.c vendor/linmodem/v90dil.c vendor/linmodem/v90upstream.c vendor/linmodem/v90trellis.c vendor/linmodem/v90qam8.c vendor/linmodem/v90equalizer.c vendor/linmodem/v90shell.c vendor/linmodem/v90mapping.c vendor/linmodem/v42detect.c vendor/linmodem/v90odp.c -lm -o /tmp/v90-phase4-profile-sanitize
          /tmp/v90-phase4-profile-sanitize
      - name: Test training profiles through mu-law
        run: python3 tools/tests/v90-training-profile.py --pcmu
      - name: Sanitize training profile initialization
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-training-profile-sanitize.c vendor/linmodem/v90training.c vendor/linmodem/v90cp.c vendor/linmodem/v90dil.c -lm -o /tmp/v90-training-profile-sanitize
          /tmp/v90-training-profile-sanitize
      - name: Test 3000-symbol PCM profiles
        run: |
          set -e
          for baud in 3000 3200; do
            python3 tools/tests/v90-qam8-wave.py --symbol-rate "$baud" --28800 --pcmu --odp-prefix --isi --random-payloads
            SIPFAX_V90_ODP_TRAINING=1 python3 tools/tests/v90-qam8-wave.py --symbol-rate "$baud" --28800 --pcmu --odp-prefix --isi --random-payloads
            SIPFAX_V90_ODP_TRAINING=1 python3 tools/tests/v90-qam8-wave.py --symbol-rate "$baud" --28800 --pcmu --odp-prefix --isi --random-payloads --odp-idle-ms 0
          done
          for rate in 4800 7200 9600 12000 14400 16800 19200 21600 24000 26400 28800; do
            python3 tools/tests/v90-qam8-wave.py --symbol-rate 3000 --"$rate" --pcmu
            python3 tools/tests/v90-qam8-wave.py --symbol-rate 3000 --"$rate" --pcmu --low-carrier
          done
          for rate in 26400 28800; do
            python3 tools/tests/v90-qam8-wave.py --symbol-rate 3000 --"$rate" --pcmu --long-clock --isi --random-payloads --timing-sweep --seed 98017
            python3 tools/tests/v90-qam8-wave.py --symbol-rate 3000 --"$rate" --pcmu --long-clock --isi --random-payloads --timing-sweep --seed 98017 --low-carrier
          done
      - name: Sanitize PCM profile initialization
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-upstream-profile-sanitize.c vendor/linmodem/v90upstream.c vendor/linmodem/v90qam8.c vendor/linmodem/v90mapping.c vendor/linmodem/v90shell.c vendor/linmodem/v90trellis.c vendor/linmodem/v90equalizer.c vendor/linmodem/v42detect.c vendor/linmodem/v90odp.c -lm -o /tmp/v90-upstream-profile-sanitize
          /tmp/v90-upstream-profile-sanitize
      - name: Sanitize LAPM candidate selection
        run: |
          echo '9ce7722543d8dd3b5d792a93b8f8e777333426965e5e352fbb67aaa4317f4df9  vendor/spandsp-v42/src/v42.c' | sha256sum -c -
          gcc -O1 -g -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare -Wno-maybe-uninitialized -fsanitize=address,undefined -fno-omit-frame-pointer -D_GNU_SOURCE -DHAVE_STDBOOL_H -DHAVE_MALLOC_H -DHAVE_POSIX_MEMALIGN -Ivendor/linmodem -Ivendor/spandsp-v42/src tools/tests/v90-lapm-select.c vendor/linmodem/v90lapmselect.c vendor/linmodem/v42detect.c vendor/spandsp-v42/src/v42.c vendor/spandsp-v42/src/hdlc.c vendor/spandsp-v42/src/crc.c vendor/spandsp-v42/src/bit_operations.c vendor/spandsp-v42/src/logging.c vendor/spandsp-v42/src/alloc.c vendor/spandsp-v42/src/async.c -o /tmp/v90-lapm-select-sanitize
          /tmp/v90-lapm-select-sanitize
      - name: Sanitize LAPM runtime bridge
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -Wno-unused-parameter -Wno-sign-compare -Wno-maybe-uninitialized -fsanitize=address,undefined -fno-omit-frame-pointer -D_GNU_SOURCE -DHAVE_STDBOOL_H -DHAVE_MALLOC_H -DHAVE_POSIX_MEMALIGN -Ivendor/linmodem -Ivendor/spandsp-v42/src tools/tests/v90-lapm-link.c vendor/linmodem/v90lapmlink.c vendor/linmodem/v90lapmselect.c vendor/linmodem/v42detect.c vendor/spandsp-v42/src/v42.c vendor/spandsp-v42/src/hdlc.c vendor/spandsp-v42/src/crc.c vendor/spandsp-v42/src/bit_operations.c vendor/spandsp-v42/src/logging.c vendor/spandsp-v42/src/alloc.c vendor/spandsp-v42/src/async.c -o /tmp/v90-lapm-link-sanitize
          /tmp/v90-lapm-link-sanitize
      - name: Test upstream clock recovery
        run: |
          /usr/bin/python3 tools/tests/v90_shell_reference.py
          /usr/bin/python3 tools/tests/v90-qam8-wave.py --clock-drift
          /usr/bin/python3 tools/tests/v90-qam8-wave.py --9600
          /usr/bin/python3 tools/tests/v90-qam8-wave.py --9600 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --12000
          python3 tools/tests/v90-qam8-wave.py --12000 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --12000 --isi
          python3 tools/tests/v90-qam8-wave.py --14400
          python3 tools/tests/v90-qam8-wave.py --14400 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --14400 --isi
          python3 tools/tests/v90-carrier-fit.py --120
          python3 tools/tests/v90-equalizer.py --120
          python3 tools/tests/v90-equalizer.py --long --120
          python3 tools/tests/v90-equalizer-half.py --120
          python3 tools/tests/v90-qam32.py --16800
          python3 tools/tests/v90-qam32.py --19200
          python3 tools/tests/v90-qam32.py --21600
          python3 tools/tests/v90-qam32.py --24000
          python3 tools/tests/v90-qam32.py --26400
          python3 tools/tests/v90-qam32.py --28800
          python3 tools/tests/v90-qam32.py --31200
          python3 tools/tests/v90-equalizer.py --long
          python3 tools/tests/v90-qam8-wave.py --16800
          python3 tools/tests/v90-qam8-wave.py --16800 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --16800 --isi
          python3 tools/tests/v90-qam8-wave.py --19200
          python3 tools/tests/v90-qam8-wave.py --19200 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --19200 --isi
          python3 tools/tests/v90-qam8-wave.py --21600
          python3 tools/tests/v90-qam8-wave.py --21600 --clock-drift
          python3 tools/tests/v90-qam8-wave.py --21600 --isi
          python3 tools/tests/v90-qam8-wave.py --21600 --clock-drift --isi
          python3 tools/tests/v90-qam8-wave.py --21600 --long-clock --isi
          python3 tools/tests/v90-qam8-wave.py --21600 --long-clock --isi --pcmu
          python3 tools/tests/v90-qam8-wave.py --19200 --long-clock --isi --pcmu
          python3 tools/tests/v90-qam8-wave.py --24000 --long-clock --isi --pcmu
          python3 tools/tests/v90-qam8-wave.py --24000 --long-clock --isi --pcmu --random-payloads --timing-sweep
      - name: Test experimental 26400 upstream waveform
        run: |
          python3 tools/tests/v90-qam8-wave.py --26400 --long-clock --isi --pcmu --random-payloads --timing-sweep
          for seed in 43127 62091 98017; do
            python3 tools/tests/v90-qam8-wave.py --26400 --long-clock --isi --pcmu --random-payloads --timing-sweep --seed "$seed" --keep-going
          done
      - name: Test experimental 28800 upstream waveform
        run: |
          python3 tools/tests/v90-qam8-wave.py --28800 --long-clock --isi --pcmu --random-payloads --timing-sweep
          for seed in 43127 62091 98017; do
            python3 tools/tests/v90-qam8-wave.py --28800 --long-clock --isi --pcmu --random-payloads --timing-sweep --seed "$seed" --keep-going
          done
      - name: Test experimental 31200 upstream waveform
        run: |
          python3 tools/tests/v90-qam8-wave.py --31200 --long-clock --isi --pcmu --random-payloads --timing-sweep
          for seed in 43127 62091 98017; do
            python3 tools/tests/v90-qam8-wave.py --31200 --long-clock --isi --pcmu --random-payloads --timing-sweep --seed "$seed" --keep-going
          done
      - name: Test automatic echo bridge framing
        run: SIPFAX_V90_LINE_ECHO=auto python3 tools/tests/linmodem-framing.py
      - name: Sanitize echo delay acquisition
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-echo-delay-sanitize.c vendor/linmodem/v90echodelay.c vendor/linmodem/v90lineecho.c -lm -o /tmp/v90-echo-delay-sanitize
          /tmp/v90-echo-delay-sanitize
      - name: Sanitize line echo history
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-line-echo-sanitize.c vendor/linmodem/v90lineecho.c -lm -o /tmp/v90-line-echo-sanitize
          /tmp/v90-line-echo-sanitize
      - name: Sanitize upstream shell mapping
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-shell-sanitize.c vendor/linmodem/v90shell.c -o /tmp/v90-shell-sanitize
          /tmp/v90-shell-sanitize
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-mapping-sanitize.c vendor/linmodem/v90mapping.c vendor/linmodem/v42detect.c vendor/linmodem/v90odp.c vendor/linmodem/v90shell.c vendor/linmodem/v90qam8.c vendor/linmodem/v90trellis.c vendor/linmodem/v90equalizer.c -lm -o /tmp/v90-mapping-sanitize
          /tmp/v90-mapping-sanitize
      - name: Sanitize variable B1 equalizer lengths
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-equalizer-length-sanitize.c vendor/linmodem/v90equalizer.c -lm -o /tmp/v90-equalizer-length-sanitize
          /tmp/v90-equalizer-length-sanitize
      - name: Sanitize provisional feedback history
        run: |
          gcc -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -Ivendor/linmodem tools/tests/v90-feedback-sanitize.c vendor/linmodem/v90trellis.c vendor/linmodem/v90equalizer.c vendor/linmodem/v90shell.c vendor/linmodem/v90mapping.c vendor/linmodem/v42detect.c vendor/linmodem/v90odp.c -lm -o /tmp/v90-feedback-sanitize
          /tmp/v90-feedback-sanitize
      - name: Test experimental soft receiver lifecycle
        run: |
          SIPFAX_V90_SOFT_RX=1 /usr/bin/python3 tools/tests/v90-e-recovery.py
          SIPFAX_V90_SOFT_RX=1 /usr/bin/python3 tools/tests/v90-cps-wave.py
